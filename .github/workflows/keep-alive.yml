name: Keep Render service awake

# Render free web services spin down after ~15 minutes of inactivity.
# This workflow pings the health endpoint every 10 minutes, around the
# clock, so the demo stays warm.
#
# Budget: 24/7 awake time is ~730 of the 750 free instance-hours Render
# grants per workspace per month. Those hours are shared, so other free
# web services in the workspace have very little headroom - they may be
# suspended near the end of a month. Static sites do not consume hours.
#
# To limit the hours instead, use a window such as "*/10 1-17 * * *"
# (06:30-23:29 IST, ~510 hours/month).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /health
        env:
          URL: https://support-ticket-intelligence-i68m.onrender.com/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 100 -o /dev/null -w '%{http_code}' "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "Service did not return 200" >&2
          exit 1
