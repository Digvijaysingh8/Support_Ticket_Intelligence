name: Keep Render service awake

# Render free web services spin down after ~15 minutes of inactivity.
# This workflow pings the health endpoint so the demo stays warm.
#
# Schedule is UTC. 01:00-17:59 UTC = 06:30-23:29 IST, ~17h/day (~510 of
# Render's 750 free instance-hours/month), leaving headroom for the other
# free services in the workspace.
#
# To keep it awake 24/7 instead, replace the cron line with:
#   - cron: "*/10 * * * *"
# Note: 24/7 uses ~730 of the 750 hours, which can suspend the workspace's
# other free web services.

on:
  schedule:
    - cron: "*/10 1-17 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /health
        env:
          URL: https://support-ticket-intelligence-i68m.onrender.com/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 100 -o /dev/null -w '%{http_code}' "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "Service did not return 200" >&2
          exit 1
